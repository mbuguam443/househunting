{% extends 'base.html' %}
{% block title %}Log In - PataNyumba{% endblock %}
{% block content %}
<section style="min-height:100vh;padding-top:var(--nav);display:flex;align-items:center;">
    <div class="aur aur-a" style="top:50%;left:50%;transform:translate(-50%,-50%)"></div>
    <div class="container position-relative" style="z-index:1">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="gc p-4" data-aos="fade-up">
                    <div class="text-center mb-4">
                        <div class="logo-i" style="width:40px;height:40px;font-size:1rem;margin:0 auto 12px"><i class="fa-solid fa-compass"></i></div>
                        <h3 class="fw-bold">Welcome Back</h3>
                        <p style="color:var(--tx3);font-size:.875rem">Log in to your PataNyumba account</p>
                    </div>
                    <form method="POST">
                        {% csrf_token %}
                        <label class="olbl"><i class="fa-regular fa-user me-1"></i>Username</label>
                        <input class="oinp" type="text" name="username" placeholder="yourusername" required>
                        <label class="olbl"><i class="fa-solid fa-lock me-1"></i>Password</label>
                        <input class="oinp" type="password" name="password" placeholder="********" required>
                        <button type="submit" class="bgrd btn w-100 py-3 fw-semibold fs-6">Log In <i class="fa-solid fa-arrow-right ms-1 fa-sm"></i></button>
                    </form>
                    <div class="odiv">or</div>
                    <p class="text-center" style="font-size:.82rem;color:var(--tx3)">Don't have an account? <a href="{% url 'accounts:register' %}" style="color:var(--pur)">Create one free</a></p>
                    <p class="text-center" style="font-size:.78rem;color:var(--tx3)">Are you a landlord? <a href="{% url 'accounts:register' %}" style="color:var(--pur)">Register here</a> to list properties.</p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
